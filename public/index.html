<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#141a33"><meta name="apple-mobile-web-app-capable" content="yes"><title>야시장 부자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}

:root{
  color-scheme:dark;
  --night:#141a33; --night2:#1c2446; --night3:#243058; --line:#33406f;
  --text:#efe9f7; --muted:#a3abcf;
  --lantern:#ffa24c; --lantern-ink:#2b1500; --pink:#ff5d8f;
  --paper:#fbf4e6; --ink:#2a2233; --ink2:#6e6378;
  --corner:#ffd7a3; --cardt:#ffdfea; --taxt:#e4e0ee;
  --display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;
  background-image:radial-gradient(ellipse at 20% -10%,rgba(255,162,76,.12),transparent 55%),radial-gradient(ellipse at 90% 110%,rgba(255,93,143,.10),transparent 50%);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit}
.app{height:100%;margin:0 auto}
.side{display:none!important}
.bar{display:none!important}
.rotate{display:none}
html.need-rotate .app,html.need-rotate .sheet,html.need-rotate .back{display:none!important}
html.need-rotate .rotate{display:flex;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:var(--night)}
.rotate .phone{width:46px;height:78px;border:3px solid var(--lantern);border-radius:10px;position:relative;animation:turn 2.4s ease-in-out infinite}
.rotate .phone::after{content:"";position:absolute;bottom:5px;left:50%;width:10px;height:3px;margin-left:-5px;border-radius:2px;background:var(--lantern)}
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
.rotate h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:var(--lantern)}
.rotate p{margin:0;color:var(--muted);max-width:30ch;font-size:14px}

/* board */
.boardwrap{width:100%;height:100%}
.board{container-type:size;display:grid;grid-template-columns:1.45fr repeat(9,minmax(0,1fr)) 1.45fr;grid-template-rows:1.45fr repeat(9,minmax(0,1fr)) 1.45fr;width:100%;height:100%;gap:2px;background:#0c1026;padding:3px;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.35);position:relative}
.tile{--ts:clamp(14px,3.6cqmin,34px);position:relative;background-color:var(--tb,#283462);background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 40%,rgba(0,0,0,.18));color:#fff;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;cursor:pointer;border:0;padding:0;text-align:left}
.tile:focus-visible{outline:2px solid #fff;outline-offset:1px;z-index:2}
.tile.k-s{--tb:var(--g)}
.tile .band{height:13%;flex:none;display:none;position:relative}
.tile.k-s .band{display:block;height:15%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 12.5%,rgba(0,0,0,.14) 12.5% 25%)}
.tile.k-s .band::after{content:"";position:absolute;left:0;right:0;top:100%;height:clamp(2px,.5cqmin,5px);background:radial-gradient(circle at 50% 0,rgba(255,255,255,.34) 0 60%,transparent 64%) 0 0/12.5% 100% repeat-x}
.tile .ico{position:absolute;right:4%;bottom:4%;width:clamp(10px,2.5cqmin,24px);height:auto;z-index:1;opacity:.95}
.tile.corner .ico{width:clamp(18px,5.2cqmin,50px);right:7%;bottom:7%}
.tile .nm{font-weight:700;font-size:clamp(8px,min(1.05cqw,2.1cqh),15px);line-height:1.12;padding:3px 2px 0 3px;word-break:keep-all;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;position:relative;z-index:1}
.tile .pr{font-size:clamp(7px,min(.85cqw,1.7cqh),12.5px);color:rgba(255,255,255,.78);padding:1px 3px 0;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;position:relative;z-index:1}
.tile.k-card{--tb:#9c2567}
.tile.k-card::after{content:"?";position:absolute;right:4%;bottom:0;font-family:var(--display);font-size:clamp(14px,3.4cqmin,34px);line-height:1;color:rgba(255,255,255,.28)}
.tile.k-park{--tb:#455a64}
.tile.k-park .band{display:block;background:repeating-linear-gradient(90deg,#1c262b 0 5px,#e9eef0 5px 8px)}
.tile.k-tax,.tile.k-gojail{--tb:#241818}
.tile.k-tax .band,.tile.k-gojail .band{display:block;background:repeating-linear-gradient(-45deg,#ffcc00 0 4px,#16110a 4px 8px)}
.tile.k-tax .nm,.tile.k-gojail .nm{color:#ffd84d}
.tile.k-tax .pr,.tile.k-gojail .pr{color:#ffb4a8;font-weight:700}
.tile .warn{position:absolute;right:3%;bottom:4%;width:clamp(11px,2.6cqmin,24px);height:auto;z-index:1}
.tile.corner .warn{width:clamp(20px,5.2cqmin,50px);right:7%;bottom:7%}
.tile.corner{--ts:clamp(16px,3.8cqmin,36px)}
.tile.corner{--tb:#283462}
.tile.k-gojail.corner{--tb:#241818}
.tile.corner .nm{font-family:var(--display);font-weight:400;font-size:clamp(9px,2.1cqmin,18px);padding:4px 3px 0 4px;white-space:normal;letter-spacing:0;color:var(--lantern)}
.tile.k-gojail.corner .nm{color:#ffd84d}
.tile.k-busk{--tb:#283462}
.tile.owned{box-shadow:inset 0 0 0 3px var(--own),inset 0 0 12px rgba(0,0,0,.25)}
.tile .flag{position:absolute;top:2px;right:2px;width:clamp(11px,2cqmin,19px);aspect-ratio:1;border-radius:50%;background:var(--own);border:1.5px solid #fff;overflow:hidden;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tile .flag svg{width:100%;height:100%;display:block}
.tile .toks{position:absolute;left:0;right:0;bottom:3%;display:flex;justify-content:center;pointer-events:none;z-index:2}
.tile .tok{width:var(--ts)}
.tile .tok+.tok{margin-left:calc(var(--ts) * -.42)}
.tile .lvl{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:clamp(9px,min(1.2cqw,2.4cqh),15px);line-height:1;color:#ffe27a;text-shadow:0 1px 2px rgba(0,0,0,.8);letter-spacing:-.05em;z-index:2;white-space:nowrap}
.tile .lvl.star3{background:linear-gradient(180deg,#ffe27a,#ffb300);color:#3a2400;text-shadow:none;border-radius:4px;padding:1px 4px;font-weight:700;top:2px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.tile.exable{outline:3px solid var(--lantern);outline-offset:-2px;z-index:3;animation:exp 0.9s ease-in-out infinite alternate}
@keyframes exp{to{outline-color:rgba(255,162,76,.25)}}
.exlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:95%}
.exchip{appearance:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:6px 10px;min-height:40px;background:var(--g);color:#fff;font-weight:700;cursor:pointer;font-size:clamp(12px,1.9cqmin,14px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.exchip small{font-weight:600;opacity:.85}
.exchip:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tile.sellable{outline:3px solid #ff6b6b;outline-offset:-2px;z-index:3;animation:sellp .8s ease-in-out infinite alternate}
@keyframes sellp{to{outline-color:rgba(255,107,107,.25)}}
.sellhead{width:100%;text-align:center;font-size:clamp(12px,2cqmin,15px);color:#ffb4a8}
.sellhead b{color:#ff8a8a;font-size:1.15em}
.sellchip small{color:#b9f5c9}
.ghost.danger{border-color:#8a3a3a;color:#ffb4a8}
.btn.ex{background:#ffd84d;color:#2b1d00}
/* order ceremony */
.ord{background:rgba(12,16,38,.96);border:2px solid var(--lantern);border-radius:20px;padding:clamp(10px,2.2cqmin,22px) clamp(14px,3cqmin,30px);display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2cqmin,12px);box-shadow:0 0 50px rgba(255,162,76,.3);pointer-events:auto;max-height:100%;overflow:auto;animation:ordin .3s ease-out}
@keyframes ordin{from{opacity:0;transform:scale(.9)}}
.ord.out{animation:ordout .35s ease-in forwards}
@keyframes ordout{to{opacity:0;transform:scale(.95)}}
.ord h3{margin:0;font-family:var(--display);font-weight:400;color:var(--lantern);font-size:clamp(20px,4.6cqmin,40px)}
.ord .rows{display:flex;flex-direction:column;gap:clamp(3px,.8cqmin,8px);min-width:min(100%,340px)}
.ord .r{display:grid;grid-template-columns:3.2em auto 1fr auto auto;align-items:center;gap:10px;background:var(--night3);border-radius:12px;padding:4px 12px 4px 6px;transition:transform .4s}
.ord .r .rk{font-family:var(--display);color:var(--muted);font-size:clamp(13px,2.4cqmin,18px);text-align:center}
.ord .r.first .rk{color:var(--lantern)}
.ord .r .nm3{font-weight:700;font-size:clamp(13px,2.2cqmin,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .r .dd{display:flex;gap:4px}
.ord .r .die{width:clamp(20px,4cqmin,30px);box-shadow:0 2px 0 #d6cfe0}
.ord .r .bn{font-variant-numeric:tabular-nums;font-weight:700;color:#6ee69a;font-size:clamp(12px,2cqmin,14px);min-width:4.5em;text-align:right}
.ord .r .tok{width:clamp(22px,4.4cqmin,32px)}
.ord .skip{font-size:12px;color:var(--muted)}
.ord .die.spin{animation:spin .25s linear infinite}
@keyframes spin{50%{transform:rotate(90deg) scale(.9)}}
.tile.hl{outline:3px solid #fff;outline-offset:-1px;z-index:3;animation:hl 1s ease-in-out infinite alternate}
.tile.dim{filter:brightness(.45) saturate(.6)}
@keyframes hl{to{outline-color:rgba(255,255,255,.35)}}
.short{display:none}
@container (max-height:430px){
  .tile .pr{display:none}
}
@container (max-width:560px){
  .full{display:none}.short{display:inline}
  .tile .pr{display:none}
  .tile.corner .pr{display:block;white-space:normal;font-size:clamp(6px,1.3cqmin,9px)}
}
.tok{display:block;width:26px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--c);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4);overflow:hidden;flex:none;position:relative}
.tok svg{width:100%;height:100%;display:block}
.tile .tok{border-width:1.5px}
.tile .tok.me{box-shadow:0 0 0 2px var(--lantern),0 0 10px 2px rgba(255,162,76,.9);animation:meglow 1.3s ease-in-out infinite;z-index:2}
@keyframes meglow{50%{box-shadow:0 0 0 2px rgba(255,162,76,.3),0 0 4px 0 rgba(255,162,76,.3)}}
.tile .tok.hop{animation:hop .12s ease-out}
@keyframes hop{50%{transform:translateY(-38%)}}
.tok.lg{width:clamp(30px,6cqmin,54px);border-width:2.5px}
.tok.xl{width:clamp(48px,11cqmin,96px);border-width:3px}
.tok.sm{width:22px}

/* center */
.center{grid-row:2/11;grid-column:2/11;padding-top:clamp(14px,2.6cqmin,26px)!important;background-color:var(--night2);justify-content:flex-start!important;background-repeat:no-repeat;background-position:bottom center,center;background-size:100% 13%,100% 100%;border-radius:6px;position:relative;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1.4cqmin,14px);text-align:center;padding:clamp(16px,3cqmin,34px) clamp(8px,2.4cqmin,28px) clamp(8px,2cqmin,20px)}
.center::before{content:"";position:absolute;top:5px;left:10px;right:10px;height:10px;
  background:radial-gradient(circle at 50% 50%,#ffd27a 0 2.5px,rgba(255,210,122,.25) 3.5px,transparent 5px) 0 0/22px 10px repeat-x;animation:twinkle 2.4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.65}to{opacity:1}}
.main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.2cqmin,14px)}
.topbar{width:100%;display:flex;align-items:flex-start;gap:8px;flex:none}
.pchips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:flex;align-items:center;gap:6px;background:rgba(36,48,88,.85);border:1.5px solid transparent;border-radius:999px;padding:3px 10px 3px 3px;text-align:left;min-width:0}
.pchip .pt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.pchip .pn{font-size:clamp(10px,1.7cqmin,12.5px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:7em}
.pchip .money{font-size:clamp(12px,2.1cqmin,15px);font-variant-numeric:tabular-nums}
.pchip.now{border-color:var(--pink);background:#3a2550}
.pchip.me .pn{color:var(--lantern);font-weight:700}
.pchip.out{opacity:.4}
.pchip.spec{appearance:none;cursor:pointer;color:var(--text);padding:3px 12px 3px 8px;border-style:dashed;border-color:var(--line)}
.pchip.spec .eye{width:clamp(18px,3.4cqmin,24px);height:auto;color:#9fd6ff}
.pchip.spec .money{font-size:clamp(11px,1.9cqmin,14px)}
.pchip.mespec{border-color:#9fd6ff;border-style:solid}
.pill.specp{background:#9fd6ff;color:#0b2233}
.members .tok.sm{width:20px}
.pchip .tok{width:clamp(20px,4cqmin,28px)}
.ibs{display:flex;gap:6px;flex:none}
.ib{appearance:none;width:clamp(34px,6.4cqmin,42px);height:clamp(34px,6.4cqmin,42px);border-radius:12px;border:1.5px solid var(--line);background:rgba(36,48,88,.85);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:58%;height:58%}
.ib:hover{border-color:var(--muted)}
.ib:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sheet .panel{padding:12px 14px}
.sheet .rules{font-size:14px}
.fxl{grid-row:2/11;grid-column:2/11;pointer-events:none;position:relative;z-index:4;display:grid;place-items:center}
.banner{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(12,16,38,.94);border:2px solid var(--bc,#ffa24c);border-radius:20px;padding:clamp(10px,2.4cqmin,22px) clamp(18px,4cqmin,40px);box-shadow:0 0 0 6px rgba(0,0,0,.2),0 0 40px var(--bg2,rgba(255,162,76,.35));animation:pop 1.9s cubic-bezier(.2,1.3,.4,1) forwards;text-align:center}
.banner .t{font-family:var(--display);font-size:clamp(22px,6cqmin,54px);line-height:1.05;color:var(--bc,#ffa24c)}
.banner .s{font-size:clamp(12px,2cqmin,16px);color:var(--text);font-weight:600}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.95) translateY(-8px)}}
.bill{position:fixed;left:0;top:0;width:clamp(30px,4.2vmin,46px);z-index:45;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));will-change:transform}
.bill svg{display:block;width:100%;height:auto}
.pchip.gain{animation:gain .5s ease-out}
.pchip.lose{animation:lose .45s ease-out}
@keyframes gain{40%{box-shadow:0 0 0 3px #6ee69a,0 0 18px rgba(110,230,154,.7);transform:scale(1.06)}}
@keyframes lose{40%{box-shadow:0 0 0 3px #ff7a7a;transform:translateY(2px)}}
.mfloat{position:fixed;z-index:40;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none;font-size:15px;animation:mf 1.6s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.mfloat.plus{color:#6ee69a}.mfloat.minus{color:#ff7a7a}
@keyframes mf{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
.parade{display:flex;gap:clamp(4px,1cqmin,10px);justify-content:center;flex-wrap:wrap}
.parade .tok{width:clamp(26px,5.4cqmin,48px);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-18%)}}
.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,1cqmin,10px);width:100%;max-width:380px}
.pick{appearance:none;background:var(--night3);border:2px solid transparent;border-radius:12px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text);cursor:pointer;font-size:clamp(10px,1.6cqmin,12.5px);line-height:1.2;min-width:0}
.pick .tok{width:clamp(28px,5.6cqmin,46px)}
.pick.mine{border-color:var(--lantern);background:#33294a}
.pick.taken{opacity:.55;cursor:default}
.pick small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pick.mine small{color:var(--lantern);font-weight:700}
.lrows{display:flex;flex-direction:column;gap:6px;width:100%;max-width:320px}
.lrow{display:flex;gap:8px;align-items:center}
.lrow .pickc{appearance:none;background:none;border:0;padding:0;cursor:pointer;flex:none}
.lrow .pickc .tok{width:40px}
.who{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.who small{font-size:.62em;color:var(--muted);font-weight:400}
.crown{width:clamp(40px,8cqmin,76px);margin-bottom:-6px}
.reacts{grid-row:2/11;grid-column:2/11;pointer-events:none;position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:clamp(14px,3cqmin,30px);overflow:hidden}
.bubble{display:inline-flex;align-items:center;gap:6px;background:rgba(20,26,51,.92);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:clamp(11px,2cqmin,17px);font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.35);animation:bub 2.8s ease-out forwards}
.bubble .e{font-size:1.35em;line-height:1}
@keyframes bub{0%{opacity:0;transform:translateY(12px) scale(.9)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.brand{font-family:var(--display);font-size:clamp(26px,7cqmin,60px);line-height:1;color:var(--lantern);letter-spacing:.01em;text-shadow:0 0 18px rgba(255,162,76,.45)}
.sub{color:var(--muted);font-size:clamp(11.5px,1.8cqmin,15px);margin:0;max-width:34ch}
.eyebrow{font-size:clamp(10px,1.5cqmin,12px);letter-spacing:.14em;color:var(--muted)}
.code{font-family:var(--display);font-size:clamp(34px,9cqmin,76px);line-height:1;color:var(--lantern);letter-spacing:.12em;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.row{display:flex;gap:8px;width:100%}
.row>*{flex:1;min-width:0}
input.f{background:var(--night);border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font-size:16px;min-height:44px;width:100%}
input.f:focus{outline:none;border-color:var(--lantern)}
.btn{appearance:none;border:0;border-radius:10px;background:var(--lantern);color:var(--lantern-ink);font-weight:700;font-size:clamp(14px,2cqmin,17px);padding:10px 18px;min-height:44px;cursor:pointer;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.ghost:focus-visible,.icon:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pink{background:var(--pink);color:#fff}
.ghost{appearance:none;background:transparent;border:1.5px solid var(--line);color:var(--text);border-radius:10px;padding:8px 14px;min-height:44px;font-weight:600;cursor:pointer;font-size:clamp(13px,1.8cqmin,15px)}
.ghost:hover{border-color:var(--muted)}
.note{font-size:clamp(11px,1.6cqmin,13px);color:var(--muted);margin:0;max-width:40ch}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px;padding:6px}
.rooms{display:flex;flex-direction:column;gap:6px;width:100%;max-width:320px}

function newGame(code){return {code,phase:'lobby',players:[],turn:0,round:1,owners:Array(N).fill(-1),lv:Array(N).fill(0),dice:[0,0],seq:0,stage:'roll',msg:'',log:[],card:''};}
function groupTiles(g){const a=[];T.forEach((t,j)=>{if(t.k==='s'&&t.g===g)a.push(j)});return a;}

function lvOf(s,j){return (s&&s.lv&&s.lv[j])||0;}
function exCost(j){return Math.round(T[j].p*CFG.exCost/10)*10;}

function stallsOf(s,i){return s.owners.filter(o=>o===i).length;}

function alive(s){return s.players.filter(p=>!p.out);}

function checkOver(s){const al=alive(s);if(s.phase==='play'&&al.length<=1){s.phase='over';s.winner=al.length?s.players.indexOf(al[0]):-1;s.endReason='bankrupt';}}

function sellValue(s,j){return Math.round((T[j].p+(T[j].k==='s'?exCost(j)*lvOf(s,j):0))*CFG.sellMult/10)*10;}
function sellable(s,i){const a=[];s.owners.forEach((o,j)=>{if(o===i)a.push(j)});return a;}

function sellTile(s,i,j){const p=s.players[i];const v=sellValue(s,j);p.money+=v;tx(s,-1,i,v);s.owners[j]=-1;if(s.lv)s.lv[j]=0;return v;}
function settleOwe(s){const p=s.players[s.turn];while(s.owe&&s.owe.length&&p.money>0){const o=s.owe[0];const x=Math.min(o.amt,p.money);p.money-=x;tx(s,s.turn,o.to,x);o.amt-=x;if(o.to>=0&&s.players[o.to])s.players[o.to].money+=x;if(o.amt<=0)s.owe.shift();}}

function land(s,depth){const i=s.turn,p=s.players[i],t=T[p.pos];s.stage='end';
  switch(t.k){

    if(o<0){if(p.money>=t.p){s.stage='buy';addLog(s,`${p.name}: ${t.n} 자리가 비어 있어요`);}else addLog(s,`${p.name}: ${t.n}을(를) 살 돈이 부족해요`);}

    break;}
  case 'tax':addLog(s,`${p.name}: ${t.n} ${t.amt}${UNIT} 냈어요`);pay(s,i,-1,t.amt);break;
  case 'gojail':p.pos=10;p.skip=true;addLog(s,`${p.name}: 단속에 걸려 단속반으로! 다음 턴은 쉬어요`);break;
  case 'jail':addLog(s,`${p.name}: 단속반을 구경만 해요`);break;
  case 'busk':{let n=0;s.players.forEach((q,j)=>{if(j!==i&&!q.out){pay(s,j,i,20);n++}});addLog(s,`${p.name}: 버스킹 공연으로 ${n*20}${UNIT} 모았어요`);break;}
  case 'rest':addLog(s,`${p.name}: 분수광장에서 쉬어가요`);break;

}
function finish(s){s.phase='over';s.endReason=s.endReason||'rounds';let best=-1,bw=-1;s.players.forEach((p,i)=>{if(!p.out){const w=worth(s,i);if(w>bw){bw=w;best=i}}});s.winner=best;}
function nextTurn(s){if(s.phase!=='play')return;const n=s.players.length,prev=s.turn;let k=0;
  do{s.turn=(s.turn+1)%n;k++}while(s.players[s.turn].out&&k<=n);
  if(s.turn<=prev){s.round++;if(s.round>CFG.rounds){s.round=CFG.rounds;s.endReason='rounds';finish(s);addLog(s,`${CFG.rounds}라운드 종료! 자산이 가장 많은 사람이 이겨요`);return;}}
  s.stage='roll';s.card='';s.dbl=0;s.extra=false;s.lastDbl=0;s.exPend=false;s.exTarget=null;s.owe=[];s.resume=null;const p=s.players[s.turn];s.msg=p.skip?`${p.name} 차례 (이번엔 쉬어요)`:`${p.name} 차례예요`;}
function afterAct(s){if(s.phase==='play'&&s.stage==='end'&&s.extra){const p=s.players[s.turn];s.extra=false;
  if(p.out||p.skip){s.dbl=0;return;}s.stage='roll';s.card='';s.msg=`${p.name}: 더블! 한 번 더 굴려요`+(s.dbl>=2?' (한 번 더 나오면 단속!)':'');}}
function resolvePend(s){if(s.phase!=='play'||s.stage!=='end'||!s.exPend)return;s.exPend=false;const p=s.players[s.turn];if(p.out)return;
  if(expandable(s,s.turn).length){s.stage='expandAny';s.msg=`${p.name}: 입구 통과 보너스! 확장할 노점을 하나 골라요`;}}
function checkDebt(s){if(s.phase!=='play'||!s.owe||!s.owe.length)return;const p=s.players[s.turn];

  if(owed(s)<=0){s.owe=[];return;}
  if(assetValue(s,s.turn)<owed(s)&&!sellable(s,s.turn).length){s.owe=[];goBroke(s,s.turn,'파산! 팔 가게도 없어요');if(s.phase==='play')s.stage='end';return;}
  if(s.stage!=='sell'){s.resume=s.stage;s.stage='sell';s.msg=`${p.name}: 현금이 모자라요! 가게를 팔아 ${owed(s)}${UNIT}을 마련해야 해요`;}}
function afterSell(s){const p=s.players[s.turn];let st=s.resume||'end';s.resume=null;
  if(st==='take'&&!(p.money>=takePrice(p.pos,s)&&s.owners[p.pos]>=0&&s.owners[p.pos]!==s.turn))st='end';
  if(st==='buy'&&!(s.owners[p.pos]<0&&p.money>=T[p.pos].p))st='end';
  if((st==='expand'&&!canExpand(s,s.turn,s.exTarget))||(st==='expandAny'&&!expandable(s,s.turn).length))st='end';

  if(typeof a==='string'&&a.indexOf('ex:')===0&&(s.stage==='expand'||s.stage==='expandAny')){const j=parseInt(a.slice(3),10);
    if(!(j>=0&&j<N)||(s.stage==='expand'&&j!==s.exTarget)||!canExpand(s,i,j))return false;
    p.money-=exCost(j);tx(s,i,-1,exCost(j));s.lv[j]=lvOf(s,j)+1;const L=s.lv[j];
    addLog(s,`${p.name}: ${T[j].n} 확장! ${L>=CFG.exMax?'명물 가게가 됐어요 (인수 불가)':L+'단계'} · 이용료 ${rent(s,j)}${UNIT}`);s.stage='end';s.exTarget=null;return true;}
  if(s.stage==='sell'){
    if(typeof a==='string'&&a.indexOf('sell:')===0){const j=parseInt(a.slice(5),10);if(!(j>=0&&j<N)||s.owners[j]!==i)return false;
      const v=sellTile(s,i,j);settleOwe(s);addLog(s,`${p.name}: ${T[j].n}을(를) ${v}${UNIT}에 팔았어요`+(owed(s)>0?` · 아직 ${owed(s)}${UNIT} 부족`:' · 빚을 다 갚았어요'));
      if(owed(s)<=0){s.owe=[];afterSell(s);}else if(!sellable(s,i).length){s.owe=[];goBroke(s,i,'파산! 가게를 다 팔아도 모자라요');if(s.phase==='play')s.stage='end';}

      while(owed(s)>0&&js.length){const j=js.shift();sellTile(s,i,j);settleOwe(s);sold.push(T[j].n);}

      if(owed(s)<=0){s.owe=[];afterSell(s);}else{s.owe=[];goBroke(s,i,'파산! 가게를 다 팔아도 모자라요');if(s.phase==='play')s.stage='end';}return true;}
    if(a==='giveup'){s.owe=[];goBroke(s,i,'님이 파산을 선언했어요');if(s.phase==='play')s.stage='end';return true;}
    return false;}
  if(a==='pass'&&(s.stage==='expand'||s.stage==='expandAny')){addLog(s,`${p.name}: 확장하지 않았어요`);s.stage='end';s.exTarget=null;return true;}

      if(s.dbl>=3){p.pos=10;p.skip=true;s.dbl=0;s.extra=false;s.stage='end';addLog(s,`${p.name}: 더블 3번! 단속반으로 끌려가 다음 턴은 쉬어요`);return true;}

  const me=myId();
  tiles.forEach((el,i)=>{const h=by[i].map(p=>`<span class="tok${mode!=='local'&&p.id===me?' me':''}${view[p.id]!=null&&view[p.id]!==p.pos?' hop':''}" style="--c:${PC[p.c]}" title="${esc(p.name)}">${CH[p.c].svg}</span>`).join('');

let stepper=null;
function animateTokens(){
  if(!inGame()){for(const k in view)delete view[k];return;}
  S.players.forEach(p=>{if(view[p.id]==null)view[p.id]=p.pos;});
  if(stepper)return;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let movedAny=false;
  stepper=setInterval(()=>{let moving=false;
    if(S)S.players.forEach(p=>{const v=view[p.id];if(v==null||v===p.pos)return;moving=true;movedAny=true;
      const fwd=(p.pos-v+N)%N,back=(v-p.pos+N)%N;
      if(reduce||Math.min(fwd,back)>12){view[p.id]=p.pos;return;} // jumps (단속반, 카드 이동) teleport
      view[p.id]=fwd<=back?(v+1)%N:(v+N-1)%N;});
    renderTokens();if(!moving){clearInterval(stepper);stepper=null;if(movedAny)setTimeout(render,140);}},reduce?10:140);}

      acts=`<div class="sellhead">부족한 돈 <b>${owed(S).toLocaleString()}${UNIT}</b> · 팔 가게를 골라요 (반값)</div><div class="exlist">${js.map(j=>`<button class="exchip sellchip" style="--g:${T[j].k==='s'?G[T[j].g]:'#455a64'}" data-act="sell" data-pos="${j}" ${dis}>${T[j].n}${lvOf(S,j)?' '+'★'.repeat(lvOf(S,j)):''}<small>+${sellValue(S,j)}</small></button>`).join('')}</div><button class="ghost danger" data-act="giveup" ${dis}>${confirmGiveup?'정말 파산할까요? 한 번 더 누르기':'파산하기'}</button>`;}
    else if(S.stage==='expandAny'){const js=expandable(S,S.turn).sort((a,b)=>b-a);acts=`<div class="exlist">${js.map(j=>`<button class="exchip" style="--g:${G[T[j].g]}" data-act="ex" data-pos="${j}" ${dis}>${T[j].n}<small>${lvOf(S,j)}→${lvOf(S,j)+1} · ${exCost(j)}</small></button>`).join('')}</div><button class="ghost" data-act="pass" ${dis}>안 할래요</button>`;}
    else acts=`<button class="btn pink" data-act="end" ${dis}>턴 넘기기</button>`;}
  const youTag=(mode!=='local'&&mine?'<span class="pill">내 차례</span>':'')+(amSpectator()?'<span class="pill specp">관전 중</span>':'')+(S.dbl&&S.phase==='play'?`<span class="pill dblp">더블 ×${S.dbl}</span>`:'');
  setCenter('play',`<div class="round"><b>${S.round}</b> / ${CFG.rounds} 라운드</div>
    <div class="turnline">${tokHTML(cur,'lg')}<span class="who"><b>${esc(cur.name)} 차례</b><small>${CH[cur.c].food} ${CH[cur.c].n}</small></span> ${youTag}${online()?'<span class="tsec" id="tsec"></span>':''}</div>
    ${online()?'<div class="timer" id="timer"><i></i></div>':''}
    <div class="dicerow${S.dice[0]&&S.dice[0]===S.dice[1]?' isdbl':''}">${dieHTML(S.dice[0],rolling)}${dieHTML(S.dice[1],rolling)}<span class="total">${S.dice[0]?S.dice[0]+S.dice[1]:''}</span></div>
    ${S.card&&!walking?`<div class="cardbox"><small>뽑기 카드</small>${esc(S.card)}</div>`:''}
    <p class="msg">${walking?`${esc(cur.name)}님이 이동하는 중…`:esc(S.msg)}</p>
    ${walking?'':acts?`<div class="acts">${acts}</div>`:`<p class="wait">${esc(cur.name)}님이 ${S.stage==='sell'?`돈이 모자라 팔 가게를 고르는 중… (부족 ${owed(S)}${UNIT})`:'하는 중…'}</p>`}`,true);
  tickTimer();
}

/* ---------- timer ---------- */
function tickTimer(){
  if(!online()||!S||S.phase!=='play')return;
  const sg=sig(S);if(sg!==timerSig){timerSig=sg;timerStart=Date.now();}
  const left=Math.min(TURN_SEC,Math.max(0,TURN_SEC-(Date.now()-timerStart-(S.seq===0&&S.round===1?ORD_MS:0))/1000));
  const tb=document.getElementById('timer'),ts=document.getElementById('tsec');
  if(tb){tb.firstChild.style.transform=`scaleX(${left/TURN_SEC})`;tb.classList.toggle('low',left<10);}
  if(ts){ts.textContent=Math.ceil(left)+'초';ts.classList.toggle('low',left<10);}
}
setInterval(tickTimer,250);
function autoTurn(s){const p=s.players[s.turn];if(!p)return;
  for(let k=0;k<4&&s.phase==='play'&&s.players[s.turn]===p;k++){
    if(s.stage==='sell')apply(s,'autosell');
    if(s.stage==='roll')apply(s,'roll');
    if(s.phase==='play'&&(s.stage==='buy'||s.stage==='take'||s.stage==='expand'||s.stage==='expandAny'))apply(s,'pass');
    if(s.phase==='play'&&(s.stage==='buy'||s.stage==='take'||s.stage==='expand'||s.stage==='expandAny'))apply(s,'pass');
    if(s.phase==='play'&&s.stage==='end'){addLog(s,`${p.name}: 시간이 지나 자동으로 진행했어요`);apply(s,'end');break;}}}
setInterval(()=>{if(mode!=='host'||!S||S.phase!=='play')return;const sg=sig(S),now=Date.now();
  if(sg!==hostSig){hostSig=sg;hostStart=now;return;}
  if(now-hostStart>TURN_SEC*1000+1500+(S.seq===0&&S.round===1?ORD_MS:0)){autoTurn(S);hostSig='';publish();render();}},1000);

/* ---------- reactions ---------- */
function showReact(p,e){if(!p)return;const b=document.createElement('div');b.className='bubble';
  b.innerHTML=`${tokHTML(p,'sm')}<span>${esc(p.name)}</span><span class="e">${esc(e)}</span>`;reacts.appendChild(b);
  while(reacts.children.length>4)reacts.firstChild.remove();setTimeout(()=>b.remove(),2900);}
function sendReact(e){if(!room||!online()||!S||S.phase!=='play')return;if(!REACTS.includes(e)&&!WORDS.includes(e))return;
  const now=Date.now();if(now-lastReactAt<1200)return;lastReactAt=now;reactN++;
  room.presence({react:{n:reactN,e}}).catch(()=>{});const i=myIdx();if(i>=0)showReact(S.players[i],e);
  else{const me=spectators().find(x=>x.me);showReact({name:(me?me.name:myName||'구경꾼')+' (관전)',c:me?me.c:chOk(myCh)},e);}}
function checkReacts(){if(!online()||!S)return;const code=S.code;
  peers.forEach(pe=>{if(pe.sameTab)return;const pr=pe.presence||{};const n=pr.react?(+pr.react.n||0):0;
    if(seenReact[pe.peer]===undefined){seenReact[pe.peer]=n;return;}
    if(n<=seenReact[pe.peer])return;seenReact[pe.peer]=n;
    const e=String(pr.react.e||'');if(!REACTS.includes(e)&&!WORDS.includes(e))return;
    let pl=null;if(pr.host&&pr.code===code)pl=S.players.find(p=>p.id==='@host');else if(pr.join===code)pl=S.players.find(p=>p.id===pe.peer);
    if(pl)showReact(pl,e);
    else if(pr.join===code)showReact({name:(clean(pr.name)||'구경꾼')+' (관전)',c:chOk(pr.ch)},e);});}

/* ---------- event effects ---------- */
const fxl=document.getElementById('fxl');let prevSnap=null;const bq=[];let bBusy=false;
function snap(s){return {lv:(s.lv||[]).slice(),owners:s.owners.slice(),out:s.players.map(p=>!!p.out),skip:s.players.map(p=>!!p.skip),money:s.players.map(p=>p.money),seq:s.seq,phase:s.phase,key:s.players.map(p=>p.id).join()};}
function detect(){
  if(!inGame()){prevSnap=null;return;}
  const cur=snap(S),pv=prevSnap;prevSnap=cur;
  if(!pv||pv.key!==cur.key||pv.phase!=='play'||cur.seq<pv.seq)return;
  let triple=false;
  if(cur.seq>pv.seq&&S.lastDbl){const p=S.players[S.turn];
    if(S.lastDbl>=3){triple=true;banner(p,'더블 3번!',`${p.name} 단속반으로 끌려가요`,'#ffcc00');}
    else banner(p,'더블!',S.lastDbl>=2?'한 번 더! 또 나오면 단속':'한 번 더 굴려요','#5ce1ff');}
  cur.lv.forEach((L,j)=>{const a=pv.lv[j]||0;const o=cur.owners[j];if(L>a&&o>=0&&pv.owners[j]===o){const p=S.players[o];
    if(L>=CFG.exMax)banner(p,'명물 가게!',`${T[j].n} · 이제 아무도 인수할 수 없어요`,'#ffd84d');else toast(p,`${T[j].n} 확장 ${'★'.repeat(L)}`);}});
  cur.owners.forEach((o,j)=>{const a=pv.owners[j];if(o<0&&a>=0&&!cur.out[a]&&S.players[a])toast(S.players[a],`${T[j].n} 매각 💸`);});
  cur.owners.forEach((o,j)=>{const a=pv.owners[j];if(o===a||o<0)return;const t=T[j],p=S.players[o];
    if(a>=0){const f=S.players[a];banner(p,'인수!',`${p.name} ← ${f?f.name:''}의 ${t.n}`,'#ff5d8f');}
    else toast(p,`${t.n} 오픈!`);
    if(t.k==='s'&&setOwned(S,t.g,o))banner(p,'세트 완성!',`${GN[t.g]} 세트 이용료 2배`,G[t.g]==='#7b4a26'?'#e0a060':lighten(G[t.g]));});
  cur.out.forEach((x,i)=>{if(x&&!pv.out[i])banner(S.players[i],'파산…',`${S.players[i].name}님이 야시장을 떠나요`,'#8b93b8');});

/* ---------- money flying between players ---------- */
let txSeen=null,txGid=null,txQueue=0;
const BILL='<svg viewBox="0 0 34 18" aria-hidden="true"><rect x=".75" y=".75" width="32.5" height="16.5" rx="2.5" fill="#6fd08c" stroke="#1f6b3a" stroke-width="1.5"/><rect x="3.5" y="3.5" width="27" height="11" rx="1.5" fill="none" stroke="#2f8a4c" stroke-width="1"/><circle cx="17" cy="9" r="3.6" fill="#b9f5c9" stroke="#1f6b3a" stroke-width="1"/><text x="17" y="11.3" text-anchor="middle" font-size="5.6" font-weight="700" fill="#1f6b3a" font-family="sans-serif">냥</text></svg>';
function chipPoint(i){const el=center.querySelector(`[data-pid="${i}"]`);if(!el)return null;const r=el.getBoundingClientRect();if(!r.width)return null;
  const t=el.querySelector('.tok');const tr=t?t.getBoundingClientRect():r;return {x:tr.left+tr.width/2,y:tr.top+tr.height/2};}
function flyMoney(t,delay){
  const from=t.f>=0?chipPoint(t.f):null,to=t.t>=0?chipPoint(t.t):null;if(!from&&!to)return;
  const n=Math.max(3,Math.min(7,Math.round(t.a/100)+2));const dur=820;
  const start=from||{x:to.x+(Math.random()*40-20),y:to.y-70},end=to||{x:from.x+(Math.random()*30-15),y:from.y-80};
  const lift=Math.min(90,40+Math.abs(end.x-start.x)*.25);
  for(let k=0;k<n;k++){const b=document.createElement('div');b.className='bill';b.innerHTML=BILL;document.body.appendChild(b);
    const jx=(Math.random()*14-7),jy=(Math.random()*10-5),rot=Math.random()*40-20;
    const mid={x:(start.x+end.x)/2+jx,y:Math.min(start.y,end.y)-lift+jy};
    const kf=to&&from?[
      {transform:`translate(${start.x}px,${start.y}px) translate(-50%,-50%) scale(.6) rotate(0deg)`,opacity:0},
      {transform:`translate(${start.x}px,${start.y}px) translate(-50%,-50%) scale(1) rotate(${rot/2}deg)`,opacity:1,offset:.12},
      {transform:`translate(${mid.x}px,${mid.y}px) translate(-50%,-50%) scale(1.1) rotate(${rot}deg)`,opacity:1,offset:.55},
      {transform:`translate(${end.x+jx}px,${end.y+jy}px) translate(-50%,-50%) scale(.7) rotate(${rot/3}deg)`,opacity:1,offset:.92},
      {transform:`translate(${end.x}px,${end.y}px) translate(-50%,-50%) scale(.3)`,opacity:0}]
    :from?[ // to the bank: leaves the payer and vanishes
      {transform:`translate(${start.x}px,${start.y}px) translate(-50%,-50%) scale(.6)`,opacity:0},
      {transform:`translate(${start.x}px,${start.y}px) translate(-50%,-50%) scale(1)`,opacity:1,offset:.15},
      {transform:`translate(${start.x+jx*4}px,${start.y-45+jy}px) translate(-50%,-50%) scale(1) rotate(${rot}deg)`,opacity:.9,offset:.55},
      {transform:`translate(${start.x+jx*7}px,${start.y-95}px) translate(-50%,-50%) scale(.4) rotate(${rot*2}deg)`,opacity:0}]
    :[ // from the bank: appears out of thin air and drops in
      {transform:`translate(${start.x+jx*4}px,${start.y+jy}px) translate(-50%,-50%) scale(.3) rotate(${rot}deg)`,opacity:0},
      {transform:`translate(${start.x+jx*2}px,${start.y+20}px) translate(-50%,-50%) scale(1) rotate(${rot/2}deg)`,opacity:1,offset:.4},
      {transform:`translate(${end.x+jx}px,${end.y+jy}px) translate(-50%,-50%) scale(.8)`,opacity:1,offset:.88},
      {transform:`translate(${end.x}px,${end.y}px) translate(-50%,-50%) scale(.3)`,opacity:0}];
    const a=b.animate(kf,{duration:dur,delay:delay+k*90,easing:'cubic-bezier(.35,.1,.3,1)',fill:'both'});
    a.onfinish=()=>b.remove();a.oncancel=()=>b.remove();}
  if(from&&to)setTimeout(()=>{const el=center.querySelector(`[data-pid="${t.t}"]`);if(el){el.classList.remove('gain');void el.offsetWidth;el.classList.add('gain');}},delay+dur*.85);
  if(from){const el=center.querySelector(`[data-pid="${t.f}"]`);if(el){el.classList.remove('lose');void el.offsetWidth;el.classList.add('lose');}}}
function playTx(){
  if(!inGame()||!S.tx){txSeen=null;return;}
  if(txSeen===null||txGid!==S.gid){txSeen=S.txn||0;txGid=S.gid;return;}
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fresh=S.tx.filter(t=>t.n>txSeen);if(!fresh.length)return;txSeen=Math.max(txSeen,...fresh.map(t=>t.n));

function makeWsRoom(){
  let pid=null;try{pid=sessionStorage.getItem('nm-peer')}catch(e){}
  if(!pid||!/^[a-z0-9]{8,32}$/.test(pid)){pid=(Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g,'').slice(0,20);try{sessionStorage.setItem('nm-peer',pid)}catch(e){}}
  let ws=null,ch=null,mine={},conn=false,retry=0,rt=null,last=[];const pcb=[],ccb=[];
  const setConn=c=>{if(c!==conn){conn=c;ccb.forEach(f=>f(c));}};
  const emit=()=>{const others=last.filter(p=>p.peer!==pid);const peers=others.map(p=>({peer:p.peer,presence:p.presence||{},away:!!p.away,sameTab:false,isMe:false,by:null,kind:'viewer',guest:false}));
    peers.push({peer:pid,presence:Object.assign({},mine),away:false,sameTab:true,isMe:true,by:null,kind:'viewer',guest:false});pcb.forEach(f=>f({peers}));};
  let emitT=null;const emitSoon=()=>{if(emitT)return;emitT=setTimeout(()=>{emitT=null;emit();},0);};
  function connect(){if(!ch)return;clearTimeout(rt);const w=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?ch='+ch+'&peer='+pid);ws=w;
    w.onopen=()=>{if(w!==ws)return;retry=0;setConn(true);w.send(JSON.stringify({t:'p',d:mine}));};
    w.onmessage=e=>{if(w!==ws)return;let d;try{d=JSON.parse(e.data)}catch(x){return}if(d&&d.t==='peers'&&Array.isArray(d.peers)){last=d.peers;emitSoon();}};
    w.onclose=()=>{if(w!==ws)return;ws=null;setConn(false);if(ch)rt=setTimeout(connect,Math.min(6000,400*Math.pow(2,retry++)));};
    w.onerror=()=>{try{w.close()}catch(x){}};}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ch&&(!ws||ws.readyState>1)){retry=0;connect();}});
  window.addEventListener('online',()=>{if(ch&&(!ws||ws.readyState>1)){retry=0;connect();}});
  setInterval(()=>{if(ws&&ws.readyState===1)ws.send('{"t":"ping"}');},20000);
  return {id:pid,
    presence(patch){const send={};for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k];send[k]=patch[k];}
      if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'p',d:send}));emitSoon();return Promise.resolve();},
    onPeers(fn){pcb.push(fn);emitSoon();return()=>{};},
    onConnection(fn){ccb.push(fn);setTimeout(()=>fn(conn),0);return()=>{};},
    connected:()=>conn,
    switchTo(c){if(c===ch)return;ch=c;mine={};last=[];const o=ws;ws=null;if(o){try{o.close()}catch(e){}}setConn(false);clearTimeout(rt);if(ch)connect();emitSoon();}};}
function saveSess(){if(NET!=='ws')return;try{

function hostTick(){if(mode!=='host'||!S)return;let changed=false;

    const js=peers.filter(p=>!p.sameTab&&p.presence&&p.presence.join===S.code&&p.presence.name);
    const ids=new Set(js.map(p=>p.peer));const before=JSON.stringify(S.players);
    S.players=S.players.filter(p=>p.id==='@host'||ids.has(p.id));
    js.forEach(p=>{let x=S.players.find(q=>q.id===p.peer);
      if(!x){if(S.players.length>=6)return;x={id:p.peer,name:clean(p.presence.name)||'손님',ch:null};S.players.push(x);}

      else if(x.ch==null||taken.has(x.ch))x.ch=CH.findIndex((_,k)=>!taken.has(k));});
    if(JSON.stringify(S.players)!==before)changed=true;}
  else if(S.phase==='play'){
    const here=new Set(peers.map(p=>p.peer));const now=Date.now();
    S.players.forEach(p=>{if(p.id==='@host'||p.out)return;if(here.has(p.id))delete goneAt[p.id];else if(!goneAt[p.id])goneAt[p.id]=now;});}

    const n=+pr.req.n||0;if(n<=(lastReq[p.peer]||0))return;lastReq[p.peer]=n;

  if(changed)publish();}

render();
if(NET==='ws'){
  room=makeWsRoom();myPeer=room.id;roomState='ok';
  room.onConnection(c=>{connected=c;render();});
  room.onPeers(onPeers);
  if(!restoreSess())render();
}else try{
  const cl=window.claude;
  if(cl&&typeof cl.use==='function'){
    cl.use('room').then(r=>{
      if(!r){roomState='none';render();return;}
      room=r;roomState='ok';
      r.onConnection(c=>{connected=c;render();},()=>{});
      r.onPeers(onPeers,()=>{roomState='none';if(online())leave();else render();});
      render();
    }).catch(()=>{roomState='none';render();});
  }else{roomState='none';render();}
}catch(e){roomState='none';render();}
})();
</script>
</body></html>
